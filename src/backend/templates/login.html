<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — MVP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h4 class="card-title mb-3">Enter</h4>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="/login">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input name="username" class="form-control" placeholder="student@astanait.edu.kz или teacher@astanait.edu.kz" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" placeholder="studentpass / teacherpass" required>
              </div>
              <button class="btn btn-primary">Log in</button>
            </form>
            <hr>
            <p class="small text-muted">Test Account: <b>student@astanait.edu.kz / studentpass</b>, or <b>teacher@astanait.edu.kz / teacherpass</b>, or <b>advisor@astanait.edu.kz / advisorpass</b></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
