<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Survey — {{ student.name if student else '' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h4>Survey for {{ student.name if student else 'student' }}</h4>
    <div>
      <a href="/teacher/dashboard" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>
  </div>

  {% if error %}
    <div class="alert alert-warning">{{ error }}</div>
  {% else %}
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Your highest education level</label>
      <select name="education_level" class="form-select" required>
        <option>Bachelor</option>
        <option>Master</option>
        <option>Doctorate</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Average GPA for the last two semesters</label>
      <select name="gpa_range" class="form-select" required>
        <option>2.0-2.7</option>
        <option>2.8-3.4</option>
        <option>Above 3.5</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How often do you attend lectures and practical classes?</label>
      <select name="attendance" class="form-select" required>
        <option>Always</option><option>Most of the time</option><option>Sometimes skip</option><option>Rarely attend</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How many hours per day do you usually spend on self-study?</label>
      <select name="self_study_hours" class="form-select" required>
        <option>Less than 1 hour</option><option>1-3 hours</option><option>More than 4 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How many hours of sleep do you get on average per night?</label>
      <select name="sleep_hours" class="form-select" required>
        <option>Less than 6 hours</option><option>7-9 hours</option><option>More than 10 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How would you rate your motivation to study?</label>
      <select name="motivation" class="form-select" required>
        <option>Very high</option><option>High</option><option>Average</option><option>Low</option><option>Very low</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Do you have a steady job while studying?</label>
      <select name="job" class="form-select" required>
        <option>Yes, full-time</option><option>Yes, part-time</option><option>No</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Do you receive financial support?</label>
      <select name="financial_support" class="form-select" required>
        <option>Full support</option><option>Partial support</option><option>No financial support</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How often do you experience stress?</label>
      <select name="stress" class="form-select" required>
        <option>Very often</option><option>Often</option><option>Sometimes</option><option>Rarely</option><option>Never</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Communication skills</label>
      <select name="communication" class="form-select" required>
        <option>Very strong</option><option>Strong</option><option>Average</option><option>Low</option><option>Very low</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Satisfaction with teaching staff qualifications</label>
      <select name="teacher_quality" class="form-select" required>
        <option>Completely satisfied</option><option>Mostly satisfied</option><option>Hard to say</option><option>Mostly dissatisfied</option><option>Completely dissatisfied</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How often do you use university resources?</label>
      <select name="use_resources" class="form-select" required>
        <option>Very often</option><option>Often</option><option>Sometimes</option><option>Rarely</option><option>Never</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How important is interest in the subject?</label>
      <select name="interest_importance" class="form-select" required>
        <option>Very important</option><option>Important</option><option>Moderately important</option><option>Slightly important</option><option>Not important</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">How much time on average do you spend preparing for exams?</label>
      <select name="exam_prep_hours" class="form-select" required>
        <option>Less than 5 hours</option><option>5–10 hours</option><option>11–20 hours</option><option>More than 20 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Which factors affect performance? (select multiple; CTRL/Command + click)</label>
      <select name="factors" class="form-select" multiple>
        <option>Personal motivation</option><option>Family support</option><option>Financial situation</option>
        <option>Teaching quality</option><option>Interest in the subject</option><option>Amount of self-study</option><option>Stress level</option>
      </select>
    </div>

    <button class="btn btn-success">Submit</button>
  </form>
  {% endif %}
</body>
</html>
