<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Advisor Survey for {{ student.name if student else '' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div class="d-flex justify-content-between mb-3">
    <h4>Extended Survey for {{ student.name if student else 'student' }}</h4>
    <div>
      <a href="/advisor/dashboard" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>
  </div>

  <form method="post">
    <!-- include the same fields as in teacher_form -->
    <div class="mb-3">
      <label class="form-label">Degree</label>
      <select name="education_level" class="form-select" required>
        <option>Bachelor</option><option>Master</option><option>Doctorate</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">GPA range</label>
      <select name="gpa_range" class="form-select" required>
        <option>2.0-2.7</option><option>2.8-3.4</option><option>Above 3.5</option>
      </select>
    </div>

    <!-- ... other common fields (attendance, self_study_hours etc.) -->
    <div class="mb-3">
      <label class="form-label">How often do you attend?</label>
      <select name="attendance" class="form-select" required>
        <option>Always</option><option>Most of the time</option><option>Sometimes skip</option><option>Rarely attend</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Self-study time</label>
      <select name="self_study_hours" class="form-select" required>
        <option>Less than 1 hour</option><option>1-3 hours</option><option>More than 4 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Sleep</label>
      <select name="sleep_hours" class="form-select" required>
        <option>Less than 6 hours</option><option>7-9 hours</option><option>More than 10 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Motivation</label>
      <select name="motivation" class="form-select" required>
        <option>Very high</option><option>High</option><option>Average</option><option>Low</option><option>Very low</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Work</label>
      <select name="job" class="form-select" required>
        <option>Yes, full-time</option><option>Yes, part-time</option><option>No</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Financial support</label>
      <select name="financial_support" class="form-select" required>
        <option>Full support</option><option>Partial support</option><option>No financial support</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Stress</label>
      <select name="stress" class="form-select" required>
        <option>Very often</option><option>Often</option><option>Sometimes</option><option>Rarely</option><option>Never</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Communication</label>
      <select name="communication" class="form-select" required>
        <option>Very strong</option><option>Strong</option><option>Average</option><option>Low</option><option>Very low</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Teaching quality</label>
      <select name="teacher_quality" class="form-select" required>
        <option>Completely satisfied</option><option>Mostly satisfied</option><option>Hard to say</option><option>Mostly dissatisfied</option><option>Completely dissatisfied</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Use of resources</label>
      <select name="use_resources" class="form-select" required>
        <option>Very often</option><option>Often</option><option>Sometimes</option><option>Rarely</option><option>Never</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Interest (importance)</label>
      <select name="interest_importance" class="form-select" required>
        <option>Very important</option><option>Important</option><option>Moderately important</option><option>Slightly important</option><option>Not important</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Exam preparation time</label>
      <select name="exam_prep_hours" class="form-select" required>
        <option>Less than 5 hours</option><option>5–10 hours</option><option>11–20 hours</option><option>More than 20 hours</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Factors (multiple selection allowed)</label>
      <select name="factors" class="form-select" multiple>
        <option>Personal motivation</option><option>Family support</option><option>Financial situation</option>
        <option>Teaching quality</option><option>Interest in the subject</option><option>Amount of self-study</option><option>Stress level</option>
      </select>
    </div>

    <hr>
    <h5>Additional fields for Advisor</h5>

    <div class="mb-3">
      <label class="form-label">Disability status</label>
      <select name="disability" class="form-select" required>
        <option>No</option><option>Yes (mild)</option><option>Yes (moderate)</option><option>Yes (severe)</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Family composition</label>
      <select name="family_complete" class="form-select" required>
        <option>Complete</option><option>Incomplete</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Large family</label>
      <select name="many_children" class="form-select" required>
        <option>No</option><option>Yes</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Family financial status</label>
      <select name="family_financial_status" class="form-select" required>
        <option>High</option><option>Medium</option><option>Low</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Are parents employed?</label>
      <select name="parents_employed" class="form-select" required>
        <option>Yes</option><option>Partially</option><option>No</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Were you registered during school time?</label>
      <select name="registered_in_school_time" class="form-select" required>
        <option>No</option><option>Yes</option>
      </select>
    </div>

    <button class="btn btn-success">Submit</button>
  </form>
</body>
</html>
